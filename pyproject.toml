[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowbound-nebius"
version = "0.1.0"
description = "Governed autonomous software engineering with Nebius Token Factory and NVIDIA Nemotron"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
  "openai>=1.75"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
